services:
  service:
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 0s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}

  app:
    extends: service
    expose: ["${APP_PORT:-3000}"]
    environment:
      APP_URL: https://${HOST}
    networks:
      default: {}
      edge:
        aliases: ["${PROJECT}"]
    deploy:
      resources:
        limits: {cpus: "${APP_CPUS:-0.5}", memory: "${APP_MEMORY:-256M}"}
        reservations: {memory: "${APP_RESERVE:-64M}"}
