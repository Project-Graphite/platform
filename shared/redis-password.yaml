services:
  redis:
    extends: {file: redis.yaml, service: redis}
    command: [sh, -c, "exec redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-48mb} --maxmemory-policy ${REDIS_POLICY:-allkeys-lru} --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
