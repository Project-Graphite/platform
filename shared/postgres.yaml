services:
  postgres:
    extends: {file: app.yaml, service: service}
    image: postgres:18-alpine
    command: [postgres, -c, "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}", -c, "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_DB: ${PROJECT}
      POSTGRES_USER: ${PROJECT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [postgres-data:/var/lib/postgresql]
    labels: {graphite.backup.postgres: "true"}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      retries: 10
    stop_grace_period: 30s
    deploy:
      resources:
        limits: {cpus: "${POSTGRES_CPUS:-0.5}", memory: "${POSTGRES_MEMORY:-256M}"}
        reservations: {memory: "${POSTGRES_RESERVE:-64M}"}
