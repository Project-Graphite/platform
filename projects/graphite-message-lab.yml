slug: graphite-message-lab
name: Graphite Message Lab
summary: >
  An interactive message board used to validate Graphite's Django API, PostgreSQL persistence,
  Redis queue, Celery worker, container registry and Compose deployment path.
tags: [django, postgresql, redis, celery, docker]
repo: project-graphite/graphite-message-lab
owner: amr
authors: [AmrMsCLL]
status: wip
listed: false

showcase:
  problem: >
    The organisation needed a disposable application that could prove the complete deployment path
    with a browser, API, persistent database, queue and background worker.
  approach: >
    A small Django message board writes messages to PostgreSQL, queues processing through Redis and
    lets a Celery worker update each record asynchronously. CI publishes immutable web and worker
    images for a Compose host.
  outcome: >
    The lab provides one interaction that verifies routing, application health, persistence,
    asynchronous work, image promotion, rollback and eventual cleanup without using a toy counter.
  contributions:
    - github: AmrMsCLL
      summary: >
        Defined the test scenario and owns the deployment, infrastructure and acceptance criteria
        used to validate the Graphite hosting path.

deploy:
  kind: compose
  host: message-lab.project-graphite.com
  database: postgres
  services:
    web:
      port: 8000
      route: /
      size: small
      env: [SECRET_KEY, ALLOWED_HOSTS, DATABASE_URL, REDIS_URL]
    worker:
      route: none
      size: small
      command: celery -A config worker --loglevel=info
      env: [SECRET_KEY, DATABASE_URL, REDIS_URL]
