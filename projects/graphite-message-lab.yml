slug: graphite-message-lab
name: Graphite Message Lab
summary: >
  An interactive message board used to validate Graphite's Django API, PostgreSQL persistence,
  Redis queue, Celery worker, container registry and Compose deployment path.
tags: [django, postgresql, redis, celery, docker]
repo: project-graphite/graphite-message-lab
owner: amr
authors: [AmrMsCLL]
status: wip
listed: false

deploy:
  kind: compose
  host: message-lab.project-graphite.com
  database: postgres
  services:
    web:
      port: 8000
      route: /
      size: small
      env: [SECRET_KEY, ALLOWED_HOSTS, DATABASE_URL, REDIS_URL]
    worker:
      route: none
      size: small
      command: celery -A config worker --loglevel=info
      env: [SECRET_KEY, DATABASE_URL, REDIS_URL]
