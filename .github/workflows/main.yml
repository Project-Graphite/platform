name: Main

on:
  push:
    branches: [main]
    paths:
      - projects/**
      - people/**
      - schema/**
      - scripts/**

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: pip install pyyaml jsonschema

      - run: python scripts/validate.py

      - run: python scripts/compile.py registry.json

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: graphite-hub,changelog

      - name: Sync to Graphite Hub and Changelog
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          for target in graphite-hub changelog; do
            git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${OWNER}/${target}.git" "/tmp/${target}"
            install -D registry.json "/tmp/${target}/site/src/data/registry.json"

            (
              cd "/tmp/${target}"
              git config user.name "graphite-registry"
              git config user.email "registry@project-graphite.com"
              git add site/src/data/registry.json

              if git diff --cached --quiet; then
                echo "Registry unchanged; ${target} already current."
                exit 0
              fi

              git commit --message "chore: sync registry from platform@${GITHUB_SHA::7}"
              git push
              echo "${target} updated."
            )
          done
