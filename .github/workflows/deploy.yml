name: Deploy

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - edge/**
      - host/**
      - shared/**
  workflow_dispatch:
    inputs:
      project:
        description: Project slug, edge, or all
        required: true
        default: all

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
  DEPLOY_URL: ${{ vars.DEPLOY_URL }}
  VPS_IPV4: ${{ vars.VPS_IPV4 }}
  BEFORE: ${{ github.event.before }}
  PROJECT: ${{ inputs.project }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.plan.outputs.pages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Allow automated pushes to change only image tags
        if: github.event_name == 'push' && endsWith(github.actor, '[bot]')
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::error::${GITHUB_ACTOR} pushed without a previous commit to compare against; deploy by hand after review."
            exit 1
          fi
          files="$(git diff --name-only "$BEFORE" HEAD | grep -Ev '^deploy/[a-z0-9-]+/values$' || true)"
          lines="$(git diff -U0 "$BEFORE" HEAD -- 'deploy/*/values' | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---) ' | grep -Ev '^[+-]IMAGE_TAG=sha-[0-9a-f]{7,40}$' || true)"
          if [ -n "$files" ] || [ -n "$lines" ]; then
            echo "::error::${GITHUB_ACTOR} may change only IMAGE_TAG lines in deploy/*/values; refusing to deploy:"
            printf '%s\n' "$files" "$lines"
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - id: plan
        run: python scripts/deploy.py plan | tee -a "$GITHUB_OUTPUT"

  vps:
    name: VPS
    needs: plan
    if: vars.DEPLOY_URL != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python scripts/deploy.py apply
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  build:
    name: ${{ matrix.project }} (build)
    needs: plan
    if: needs.plan.outputs.pages != '[]' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.pages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - id: site
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.project }}
        run: python scripts/deploy.py pages-info "$SITE" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.site.outputs.repository }}
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/${{ steps.site.outputs.directory }}/package-lock.json
      - working-directory: site/${{ steps.site.outputs.directory }}
        env:
          COMMAND: ${{ steps.site.outputs.command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          sh -c "$COMMAND"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}
          path: site/${{ steps.site.outputs.output }}
          if-no-files-found: error

  pages:
    name: ${{ matrix.project }} (pages)
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.pages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.project }}
          path: dist
      - env:
          SITE: ${{ matrix.project }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/deploy.py pages-site "$SITE"
          npx --yes wrangler@4.149.0 pages deploy dist --project-name "$SITE" --branch main
