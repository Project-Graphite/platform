name: Deploy

on:
  push:
    branches: [main]
    paths:
      - charts/core/**
      - deploy/**
      - edge/**
      - host/**
      - projects/**
      - tags/**
  workflow_dispatch:
    inputs:
      project:
        description: Project slug, edge, or all
        required: true
        default: all

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TUNNEL_ID: ${{ vars.TUNNEL_ID }}
  DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      compose: ${{ steps.plan.outputs.compose }}
      pages: ${{ steps.plan.outputs.pages }}
      down: ${{ steps.plan.outputs.down }}
      edge: ${{ steps.plan.outputs.edge }}
      wake: ${{ steps.plan.outputs.wake }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - run: python scripts/deploy.py release-core
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          PROJECT: ${{ inputs.project }}
        run: python scripts/deploy.py plan | tee -a "$GITHUB_OUTPUT"

  edge:
    name: Edge
    needs: plan
    if: needs.plan.outputs.edge == 'true' && vars.DEPLOY_SSH_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - uses: project-graphite/actions/vps-ssh@main
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - run: python scripts/deploy.py edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  compose:
    name: ${{ matrix.project }}
    needs: [plan, edge]
    if: ${{ !cancelled() && needs.plan.outputs.compose != '[]' && needs.edge.result != 'failure' && vars.DEPLOY_SSH_HOST != '' }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.compose) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - uses: project-graphite/actions/vps-ssh@main
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - run: python scripts/deploy.py compose "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  down:
    name: ${{ matrix.project }} (down)
    needs: plan
    if: needs.plan.outputs.down != '[]' && vars.DEPLOY_SSH_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.down) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - uses: project-graphite/actions/vps-ssh@main
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - run: python scripts/deploy.py down "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}

  wake:
    name: Wake schedules
    needs: [plan, compose, down]
    if: ${{ !cancelled() && needs.plan.outputs.wake == 'true' && vars.DEPLOY_SSH_HOST != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - uses: project-graphite/actions/vps-ssh@main
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - run: python scripts/deploy.py wake

  build:
    name: ${{ matrix.project }} (build)
    needs: plan
    if: needs.plan.outputs.pages != '[]' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.pages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - id: site
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
        run: python scripts/deploy.py pages-info "$PROJECT" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.site.outputs.repository }}
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/${{ steps.site.outputs.directory }}/package-lock.json
      - working-directory: site/${{ steps.site.outputs.directory }}
        env:
          COMMAND: ${{ steps.site.outputs.command }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          sh -c "$COMMAND"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}
          path: site/${{ steps.site.outputs.output }}
          if-no-files-found: error

  pages:
    name: ${{ matrix.project }} (pages)
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.pages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.project }}
          path: dist
      - env:
          PROJECT: ${{ matrix.project }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/deploy.py pages-site "$PROJECT"
          npx --yes wrangler@4.149.0 pages deploy dist --project-name "$PROJECT" --branch main
