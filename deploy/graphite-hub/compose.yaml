services:
  app:
    extends: {file: ../../shared/app.yaml, service: app}
    image: ghcr.io/project-graphite/graphite-hub/site:${IMAGE_TAG:?}
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?}
      DEPLOY_REPORT_SECRET: ${DEPLOY_REPORT_SECRET:?}
      PLATFORM_APP_CLIENT_ID: ${PLATFORM_APP_CLIENT_ID:?}
      PLATFORM_APP_PRIVATE_KEY: ${PLATFORM_APP_PRIVATE_KEY:?}
      SMTP_URL: ${SMTP_URL:-}
      ALERTS_EMAIL: ${ALERTS_EMAIL:-}
      ALERTS_FROM: ${ALERTS_FROM:-}
    volumes: [data:/data]
    labels: {graphite.backup.volumes: data}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 20s
    stop_grace_period: 10s
    depends_on:
      redis: {condition: service_healthy}

  redis:
    extends: {file: ../../shared/redis-password.yaml, service: redis}

volumes:
  data: {}
  redis-data: {}

networks:
  edge: {external: true}
