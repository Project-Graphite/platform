app:
  memory: 512M
  cpus: "0.75"
  env:
    APP_URL: https://graphite-tracker.project-graphite.com
    AUTH_TRUSTED_ORIGINS: https://graphite-tracker.project-graphite.com
    GAME_SOURCE: ${GAME_SOURCE:-igdb}
    EMAIL_PORT: ${EMAIL_PORT:-587}
  secrets: [AUTH_ACCESS_TOKEN_SECRET, EMAIL_HOST, DEFAULT_FROM_EMAIL]
  optional: [TMDB_READ_ACCESS_TOKEN, IGDB_CLIENT_ID, IGDB_CLIENT_SECRET, RAWG_API_KEY, DISABLED_SOURCES, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD]

postgres:
  memory: 384M
  cpus: "0.75"

redis:
  memory: 96M
  maxmemory: 64mb
