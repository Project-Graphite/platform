core: 1.0.0
enabled: false
secrets: [POSTGRES_PASSWORD, REDIS_PASSWORD, AUTH_ACCESS_TOKEN_SECRET, DATA_ENCRYPTION_KEY, EMAIL_HOST, DEFAULT_FROM_EMAIL]

services:
  app:
    image: ghcr.io/project-graphite/strata/app
    port: 3000
    public: true
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://strata:${POSTGRES_PASSWORD}@postgres:5432/strata
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_TRUSTED_ORIGINS: https://strata.project-graphite.com
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      APP_URL: https://strata.project-graphite.com
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    dependsOn: {postgres: healthy, redis: healthy}
    volumes: [files-data:/data/files]
    health:
      test: [CMD, wget, --quiet, --tries=1, --spider, "http://127.0.0.1:3000/api/v1/health"]
      startPeriod: 20s
    resources: {cpus: "0.75", memory: 512M, reserve: 256M}

  postgres:
    image: postgres:18-alpine
    command: [postgres, -c, shared_buffers=64MB, -c, work_mem=4MB, -c, max_connections=40]
    env:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    health:
      test: [CMD-SHELL, pg_isready -U strata -d strata]
      interval: 10s
      retries: 10
    resources: {cpus: "0.5", memory: 320M, reserve: 96M}

  redis:
    image: redis:8.10-alpine
    command: [sh, -c, "exec redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    env:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    health:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      retries: 10
    resources: {cpus: "0.25", memory: 64M, reserve: 16M}

  backup:
    image: postgres:18-alpine
    command:
      - sh
      - -c
      - |
        set -eu
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -Fc -f "/backups/strata-$$stamp.dump.partial"
          pg_restore --list "/backups/strata-$$stamp.dump.partial" > /dev/null
          mv "/backups/strata-$$stamp.dump.partial" "/backups/strata-$$stamp.dump"
          tar -czf "/backups/files-$$stamp.tar.gz" -C /data files
          find /backups -type f -mtime "+$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    env:
      PGHOST: postgres
      PGUSER: strata
      PGDATABASE: strata
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    dependsOn: {postgres: healthy}
    volumes: [backups:/backups, files-data:/data/files:ro]
    resources: {cpus: "0.25", memory: 128M, reserve: 16M}
