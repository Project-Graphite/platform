services:
  app:
    extends: {file: ../../shared/app.yaml, service: app}
    image: ghcr.io/project-graphite/console/app:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      SSH_TARGET: ubuntu@135.125.254.59
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ACCESS_TEAM: ${ACCESS_TEAM:?}
      ACCESS_AUD: ${ACCESS_AUD:?}
      ALERTS_TOKEN: ${ALERTS_TOKEN:-}
      SECRETS_KEY: ${SECRETS_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      ALERTS_EMAIL: ${ALERTS_EMAIL:-}
      ALERTS_FROM: ${ALERTS_FROM:-}
    privileged: true
    pid: host
    volumes: [/var/run/docker.sock:/var/run/docker.sock, data:/data]
    labels: {graphite.backup.volumes: data}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 10s

volumes:
  data: {}

networks:
  edge: {external: true}
