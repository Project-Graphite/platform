core: 1.0.0
enabled: false
secrets: [SECRET_KEY, POSTGRES_PASSWORD]
sleep:
  after: 30m

services:
  web:
    image: ghcr.io/project-graphite/graphite-message-lab/web
    command: [sh, -c, "python manage.py migrate --noinput && exec gunicorn -c python:config.gunicorn config.wsgi"]
    port: 8000
    public: true
    env: &app-env
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: message-lab.project-graphite.com,localhost
      CSRF_TRUSTED_ORIGINS: https://message-lab.project-graphite.com
      POSTGRES_DB: graphite_message_lab
      POSTGRES_HOST: postgres
      POSTGRES_USER: graphite_message_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "1"
    dependsOn: {postgres: healthy, redis: healthy}
    health:
      test: [CMD, curl, --fail, "http://localhost:8000/up/databases"]
      startPeriod: 20s
    stopGracePeriod: 10s
    resources: {cpus: "0.5", memory: 512M, reserve: 128M}

  worker:
    image: ghcr.io/project-graphite/graphite-message-lab/worker
    command: [celery, -A, config, worker, --loglevel=info, --concurrency=1, --max-tasks-per-child=100]
    env: *app-env
    dependsOn: {postgres: healthy, redis: healthy}
    health:
      test: [CMD-SHELL, "celery -A config inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 60s
      timeout: 30s
      startPeriod: 30s
    stopGracePeriod: 30s
    resources: {cpus: "0.5", memory: 384M, reserve: 96M}

  postgres:
    image: postgres:18.6-trixie
    env:
      POSTGRES_DB: graphite_message_lab
      POSTGRES_USER: graphite_message_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    health:
      test: [CMD-SHELL, pg_isready -U graphite_message_lab -d graphite_message_lab]
      interval: 10s
      retries: 10
    stopGracePeriod: 30s
    resources: {cpus: "0.5", memory: 512M, reserve: 96M}

  redis:
    image: redis:8.10.2-trixie
    command: [redis-server, --appendonly, "yes", --maxmemory, 96mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    health:
      test: [CMD, redis-cli, ping]
      interval: 10s
      retries: 10
    stopGracePeriod: 10s
    resources: {cpus: "0.25", memory: 128M, reserve: 16M}
