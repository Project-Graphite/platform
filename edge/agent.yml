http:
  routers:
    agent:
      rule: Host(`deploy.project-graphite.com`) && (Path(`/deploy`) || Path(`/healthz`))
      entryPoints: [websecure]
      service: agent
      tls:
        certResolver: letsencrypt
  services:
    agent:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:9000
