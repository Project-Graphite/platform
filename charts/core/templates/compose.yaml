{{- $values := .Values -}}
{{- $conditions := dict "healthy" "service_healthy" "started" "service_started" "completed" "service_completed_successfully" -}}
{{- $volumes := dict -}}
{{- $configs := list -}}
{{- $services := include "core.services" . | fromJson -}}
{{- $public := include "core.public" . -}}
name: {{ $values.slug }}

services:
{{- range $name, $service := $services }}
  {{- $health := $service.health }}
  {{- if kindIs "string" $health }}{{ $health = dict "path" $health }}{{ end }}
  {{- $memory := $service.memory | default $values.service.memory }}
  {{ $name }}:
    image: {{ include "core.image" (dict "name" $name "service" $service "tags" $values.tags) }}
    {{- with $service.entrypoint }}
    entrypoint: {{ toRawJson . }}
    {{- end }}
    {{- with $service.command }}
    command: {{ toRawJson . }}
    {{- end }}
    {{- with $service.env }}
    environment:
      {{- range $key, $value := . }}
      {{ $key }}: {{ toString $value | toRawJson }}
      {{- end }}
    {{- end }}
    {{- with $service.dependsOn }}
    depends_on:
      {{- range $dependency, $state := . }}
      {{ $dependency }}:
        condition: {{ get $conditions $state }}
      {{- end }}
    {{- end }}
    {{- with $service.port }}
    expose:
      - {{ toString . | toRawJson }}
    {{- end }}
    {{- if eq $name $public }}
    networks:
      default: {}
      edge:
        aliases: [{{ $values.slug }}]
    {{- end }}
    {{- with $service.volumes }}
    volumes:
      {{- range . }}
      - {{ toRawJson . }}
      {{- $volume := first (splitList ":" .) }}
      {{- if regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]*$" $volume }}{{ $_ := set $volumes $volume true }}{{ end }}
      {{- end }}
    {{- end }}
    {{- with $service.files }}
    configs:
      {{- range $target, $content := . }}
      {{- $config := printf "%s-%s" $name (base $target | replace "." "-") }}
      {{- $configs = append $configs (dict "name" $config "content" $content) }}
      - source: {{ $config }}
        target: {{ $target }}
      {{- end }}
    {{- end }}
    {{- with $health }}
    healthcheck:
      {{- if .path }}
      {{- $url := printf "http://127.0.0.1:%v%s" $service.port .path }}
      test: [CMD-SHELL, {{ printf "wget -q -O /dev/null %s || curl -fsS -o /dev/null %s" $url $url | toRawJson }}]
      {{- else }}
      test: {{ toRawJson .test }}
      {{- end }}
      interval: {{ .interval | default "30s" }}
      timeout: {{ .timeout | default "5s" }}
      retries: {{ .retries | default 3 }}
      start_period: {{ .startPeriod | default "0s" }}
    {{- end }}
    init: {{ ne (toString $service.init) "false" }}
    restart: {{ ternary "no" "unless-stopped" (default false $service.once) | quote }}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    {{- with $service.stopGracePeriod }}
    stop_grace_period: {{ . }}
    {{- end }}
    {{- if $service.privileged }}
    privileged: true
    {{- end }}
    {{- with $service.pid }}
    pid: {{ . }}
    {{- end }}
    {{- if ne (toString $service.noNewPrivileges) "false" }}
    security_opt:
      - no-new-privileges:true
    {{- end }}
    {{- if and $values.sleep.after (not $service.once) }}
    labels:
      sablier.enable: "true"
      sablier.group: {{ $values.slug }}
    {{- end }}
    deploy:
      resources:
        limits:
          cpus: {{ toString ($service.cpus | default $values.service.cpus) | quote }}
          memory: {{ $memory }}
        {{- if not $service.once }}
        reservations:
          memory: {{ $service.reserve | default (printf "%dM" (div (include "core.megabytes" $memory | atoi) 4)) }}
        {{- end }}
{{- end }}
{{- if $volumes }}

volumes:
  {{- range $volume, $_ := $volumes }}
  {{ $volume }}: {}
  {{- end }}
{{- end }}
{{- if $configs }}

configs:
  {{- range $configs }}
  {{ .name }}:
    content: {{ replace "$" "$$" .content | toRawJson }}
  {{- end }}
{{- end }}
{{- if $public }}

networks:
  edge:
    external: true
{{- end }}
