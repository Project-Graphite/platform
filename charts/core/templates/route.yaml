{{- $values := .Values -}}
{{- $public := include "core.public" . -}}
{{- if $values.host }}
{{- if not $public }}{{ fail "no service gets the hostname: give one service a port, or set public: true on one of them" }}{{ end }}
{{- $service := index (include "core.services" . | fromJson) $public }}
{{- if not $service.port }}{{ fail (printf "%s gets the hostname, so it must set port" $public) }}{{ end }}
http:
  routers:
    {{ $values.slug }}:
      rule: {{ printf "Host(`%s`)" $values.host | quote }}
      entryPoints: [websecure]
      service: {{ $values.slug }}
      tls:
        certResolver: letsencrypt
      {{- if $values.sleep.after }}
      middlewares: [{{ $values.slug }}-sleep]
      {{- end }}
  services:
    {{ $values.slug }}:
      loadBalancer:
        servers:
          - url: {{ printf "http://%s:%v" $values.slug $service.port | quote }}
  {{- if $values.sleep.after }}
  middlewares:
    {{ $values.slug }}-sleep:
      plugin:
        sablier:
          sablierUrl: http://sablier:10000
          group: {{ $values.slug }}
          sessionDuration: {{ $values.sleep.after }}
          ignoreUserAgent:
            - "(?i)(bot|crawler|spider|preview|curl|wget|uptime)"
          dynamic:
            displayName: {{ $values.name | default $values.slug | quote }}
            theme: graphite
            refreshFrequency: 5s
  {{- end }}
{{- end }}
